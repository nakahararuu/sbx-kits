schemaVersion: "2"
kind: mixin
name: mise-runtimes
displayName: mise Language Runtime Domains
description: Extends the mise kit (docker/sbx-kits-contrib) with the domains mise's core plugins need to install Java, Go, Python, and Node

agentContext: |
  This kit extends docker/sbx-kits-contrib's `mise` kit. Apply both together:

    sbx run claude --kit mise --kit "git+https://github.com/nakahararuu/sbx-kits.git#dir=mise-runtimes"

  It does NOT install mise itself — `caps.network.allow` below only opens the
  domains mise's core plugins actually contact when running
  `mise install java/go/python/node`. Without the `mise` kit these installs
  never happen, so the network grants are inert but harmless on their own.

  ## Network domains, by tool

  Verified against `jdx/mise`'s core plugin source (`src/plugins/core/{node,go,python,java}.rs`)
  and, where the source alone was ambiguous, by live requests from this repo's
  dev sandbox with network policy temporarily widened.

  **Node** (`node.rs`): version listing goes through the shared mise-versions
  cache first (`mise-versions.jdx.dev/tools/node.toml`), falling back to
  `nodejs.org` directly. Tarballs download from `nodejs.org/dist/...`;
  musl/Alpine builds instead come from `unofficial-builds.nodejs.org` (glibc
  Ubuntu sandboxes won't normally hit this, kept for completeness).

  **Go** (`go.rs`): explicitly opts out of the mise-versions cache (a `mod.rs`
  comment calls out go as one of the "canonical, always-fresh" backends) —
  version listing runs `git ls-remote --tags https://github.com/golang/go`
  directly. Tarballs download from the default `go.download_mirror` setting,
  `https://dl.google.com/go` — confirmed by a direct request in this repo's own
  dev sandbox (200, no redirect to another host).

  **Python** (`python.rs`): on Linux x86_64/arm64 (this sandbox's platforms)
  `python.compile` defaults to unset, which prefers precompiled builds over
  compiling from source, so the pyenv/python-build git clone path and its
  `mise-versions.jdx.dev` calls are not exercised. Precompiled builds are
  astral-sh's `python-build-standalone` GitHub releases: listed via
  `api.github.com`, downloaded via `github.com/.../releases/download/...`,
  which redirects (302) to `objects.githubusercontent.com` — confirmed by
  following a real redirect in this repo's dev sandbox.

  **Java** (`java.rs`): version + download metadata comes from
  `mise-java.jdx.dev/jvm/<release_type>/<os>/<arch>.json`. The `url` field in
  that JSON is vendor-specific and was inspected directly (with network policy
  temporarily widened) for the `linux/x86_64` platform:
    - `openjdk` (the default `java.shorthand_vendor`, i.e. what `mise use java@21`
      resolves to without a vendor prefix) → `download.java.net`
    - most other vendors (`temurin`, `graalvm`, `corretto`-adjacent forks,
      `dragonwell`, `sapmachine`, `semeru`, `mandrel`, `kona`, `trava`, ...) are
      GitHub Releases assets, covered by the `github.com` / `api.github.com` /
      `objects.githubusercontent.com` grants already present for Go and Python.
    - vendor-proprietary CDNs NOT covered here on purpose (add them yourself if
      you pin one of these vendors): `zulu` → `cdn.azul.com`, `liberica` /
      `liberica-nik` → `download.bell-sw.com`, `jetbrains` →
      `cache-redirector.jetbrains.com`, `microsoft` → `aka.ms`, `oracle` /
      `oracle-graalvm` → `download.oracle.com`, `redhat` →
      `developers.redhat.com`.

  ## Note on credentials

  mise can also manage secrets/env vars per-directory via `mise.local.toml`
  (an `[env]`-bearing file meant to stay out of git). This kit deliberately
  does NOT touch that — it only opens network domains. Keeping secrets out of
  the sandbox entirely and injecting them via the kit-spec `credentials:`
  block (proxy-managed, never written to disk in cleartext) stays the
  recommended path; don't use mise as a credentials store here.

caps:
  network:
    allow:
      # Node
      - nodejs.org
      - unofficial-builds.nodejs.org
      - mise-versions.jdx.dev
      # Go
      - dl.google.com
      # Java (default "openjdk" vendor)
      - mise-java.jdx.dev
      - download.java.net
      # Shared: go version listing (git ls-remote), python-build-standalone
      # releases + assets, most non-default java vendors
      - github.com
      - api.github.com
      - objects.githubusercontent.com
