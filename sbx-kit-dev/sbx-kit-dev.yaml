# syntax=docker/sandbox-kit:3
# Docker Sandboxes kit: what a sandbox needs to develop and validate the
# kit-spec v3 kits in this monorepo. Usage: see README.md.
schemaVersion: "3"
kind: mixin
version: "2.0.0"
displayName: sbx Kit Dev Tools
description: Lets the agent validate the kit-spec v3 kits in this monorepo by building them with the kit frontend (docker buildx) from inside the sandbox
sourceUrl: https://github.com/nakahararuu/sbx-kits/tree/main/sbx-kit-dev
# MIGRATION NOTE: v2 installed the sbx CLI for `sbx kit validate`, which does
# not accept v3 source kits. v3 kits are validated by building them with
# `docker buildx`, so the kit now relies on the workload's Docker Engine and
# buildx plugin (docker.io/docker/sbx-kit-claude provides both) instead of
# installing anything itself.
requires: ["deb/docker-ce", "deb/docker-buildx-plugin"]

capabilities:
  # The build pulls the kit frontend (docker/sandbox-kit:3) and any base images
  # a recipe names from Docker Hub. The workload's own policy doesn't grant
  # Docker Hub, so the kit declares it rather than relying on defaults.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - registry-1.docker.io
          - auth.docker.io
          - production.cloudflare.docker.com

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./sbx-kit-dev-context.md
