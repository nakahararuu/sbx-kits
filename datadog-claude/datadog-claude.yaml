# syntax=docker/sandbox-kit:3
# Docker Sandboxes kit: Datadog investigation toolkit for Claude Code.
# Usage and design notes: see README.md.
schemaVersion: "3"
kind: mixin
version: "1.0.0"
displayName: Datadog for Claude Code
description: Datadog investigation toolkit for Claude Code — pup CLI, Claude Datadog plugin, Slack plugin, and agent skills
sourceUrl: https://github.com/nakahararuu/sbx-kits/tree/main/datadog-claude
requires: ["claude"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          # pup CLI installation (GitHub Releases) + marketplace/plugin install
          - api.github.com
          - github.com
          - objects.githubusercontent.com
          # npx skills add (agent-skills install)
          - registry.npmjs.org
      runtime:
        allow:
          # Datadog API/app (all regions)
          - datadoghq.com
          - "*.datadoghq.com"
          - datadoghq.eu
          - "*.datadoghq.eu"
          - ddog-gov.com
          - "*.ddog-gov.com"
          # plugin updates (marketplace git fetch)
          - api.github.com
          - github.com
          # Slack MCP plugin
          - mcp.slack.com
          - slack.com
          - "*.slack.com"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -e
            mkdir -p /tmp/pup-install
            ARCH=$(uname -m)
            case "$ARCH" in
              x86_64) ARCH_PATTERN="Linux_x86_64" ;;
              aarch64|arm64) ARCH_PATTERN="Linux_arm64" ;;
              *) echo "Unsupported arch: $ARCH"; exit 1 ;;
            esac
            RELEASE_URL=$(curl -fsSL https://api.github.com/repos/datadog-labs/pup/releases/latest \
              | grep browser_download_url \
              | grep "${ARCH_PATTERN}\.tar\.gz" \
              | grep -v '\.sbom\.' \
              | head -1 \
              | cut -d'"' -f4)
            curl -fsSL "$RELEASE_URL" | tar xz -C /tmp/pup-install/
            find /tmp/pup-install -maxdepth 2 -name pup -type f -exec install -m755 {} /usr/local/bin/pup \;
            rm -rf /tmp/pup-install
          user: "0"
          env: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
          description: Install pup CLI
        - command: |
            claude plugin marketplace add anthropics/claude-plugins-official
            claude plugin install datadog@claude-plugins-official
            claude plugin install slack@claude-plugins-official
          user: "1000"
          env: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
          description: Install Claude Datadog and Slack plugins
        - command: |
            npx skills add datadog-labs/agent-skills \
              --skill dd-pup \
              --skill dd-monitors \
              --skill dd-logs \
              --skill dd-apm \
              --skill dd-docs \
              --full-depth -y --global
          user: "1000"
          env: [HTTP_PROXY, HTTPS_PROXY, NO_PROXY]
          description: Install Datadog agent skills
