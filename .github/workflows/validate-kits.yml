name: Validate Kits

on:
  push:
    branches:
      - main
    paths:
      - "*/**"
      - ".github/workflows/validate-kits.yml"
  pull_request:
    paths:
      - "*/**"
      - ".github/workflows/validate-kits.yml"
  workflow_dispatch: {}

concurrency:
  group: validate-kits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      kits: ${{ steps.list.outputs.kits }}
    steps:
      - uses: actions/checkout@v4

      # A kit is a directory holding a v3 descriptor named after it
      # (<kit>/<kit>.yaml) whose first line is the kit frontend's syntax
      # directive. A leftover v2 spec.yaml, or a <kit>/<kit>.yaml without that
      # directive, is reported as a failure instead of being silently skipped
      # (otherwise CI would pass without validating that kit).
      - name: List kit directories
        id: list
        run: |
          set -euo pipefail
          if stale=$(find . -mindepth 2 -maxdepth 2 -name 'spec.yaml' | grep .); then
            echo "::error::v2 spec.yaml found (migrate to <kit>/<kit>.yaml, kit-spec v3): $stale"
            exit 1
          fi
          kits=()
          missing_syntax=()
          for f in */*.yaml; do
            kit=${f%%/*}
            [[ "$f" == "$kit/$kit.yaml" ]] || continue
            if head -1 "$f" | grep -q '^# syntax=docker/sandbox-kit:3'; then
              kits+=("$kit")
            else
              missing_syntax+=("$f")
            fi
          done
          if (( ${#missing_syntax[@]} > 0 )); then
            echo "::error::kit descriptor without '# syntax=docker/sandbox-kit:3' on its first line: ${missing_syntax[*]}"
            exit 1
          fi
          kits=$(printf '%s\n' "${kits[@]}" | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "kits=$kits" >> "$GITHUB_OUTPUT"
          echo "Discovered kits: $kits"

  validate:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.discover.outputs.kits) }}
    steps:
      - uses: actions/checkout@v4

      # `sbx kit validate` rejects v3 source kits; building the descriptor with
      # the kit frontend (docker/sandbox-kit:3) is the v3 validation path.
      # Strict decoding fails on unknown/misplaced fields, naming field and line.
      - name: Build ${{ matrix.kit }} with the kit frontend
        run: |
          docker buildx build "${{ matrix.kit }}" \
            -f "${{ matrix.kit }}/${{ matrix.kit }}.yaml" \
            --output type=cacheonly
