schemaVersion: "2"
kind: mixin
name: docker-amd64
displayName: Docker amd64 Emulation
description: Enables running --platform linux/amd64 Docker containers on an arm64 sandbox via QEMU user-mode emulation and binfmt_misc

agentContext: |
  This sandbox can run linux/amd64 Docker images even though the sandbox itself is
  arm64 (aarch64), via QEMU user-mode emulation registered in the kernel's
  binfmt_misc facility.

  Usage:

    docker run --platform linux/amd64 <image> ...
    docker pull --platform linux/amd64 <image>
    docker buildx build --platform linux/amd64 ...

  What this kit does, and why:
  - Installs the `qemu-user-binfmt` apt package (provides `/usr/bin/qemu-x86_64`).
    Note: `qemu-user-static` does not exist as a package on this Ubuntu release —
    `qemu-user-binfmt` is the correct package name.
  - At every sandbox startup, mounts the `binfmt_misc` filesystem at
    `/proc/sys/fs/binfmt_misc` (not mounted by default in this sandbox) and registers
    `qemu-x86_64` as the interpreter for ELF x86_64 binaries.
  - Both the mount and the binfmt_misc registration are kernel/runtime state, not
    filesystem state, so they do NOT persist across a sandbox restart. That's why
    both steps run as `startup` commands (idempotent — safe to re-run) rather than
    once-only `install` commands.

  Known dead end (do not retry): `docker run --privileged tonistiigi/binfmt --install
  all` reports success but does not actually enable emulation in this sandbox — the
  registration it performs does not take effect here (Docker Engine here does not
  share binfmt_misc state with a privileged container in the way that approach
  assumes). Registering directly against the mounted `binfmt_misc` filesystem, as
  this kit does, is the approach that actually works.

  Troubleshooting:
  - `exec format error` when running an amd64 container means the registration is
    missing (e.g. right after a sandbox restart, before startup commands finish, or
    if they failed). Check `ls /proc/sys/fs/binfmt_misc/` — it should list `register`,
    `status`, and `qemu-x86_64`. If `qemu-x86_64` is missing, re-run this kit's startup
    commands manually (see spec.yaml) or restart the sandbox.
  - This is pure emulation (no JIT translation cache across runs), so amd64 containers
    run noticeably slower than native arm64 ones. Prefer arm64/multi-arch images when
    available.

commands:
  install:
    - command: |
        set -e
        apt-get update -qq
        apt-get install -y -qq qemu-user-binfmt
      user: "0"
      description: Install QEMU user-mode emulators (provides /usr/bin/qemu-x86_64)
  startup:
    - command:
        - bash
        - -c
        - |
          set -e
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "docker-amd64: host is already amd64, nothing to do"; exit 0 ;;
          esac
          if ! mountpoint -q /proc/sys/fs/binfmt_misc; then
            mount binfmt_misc -t binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          if [ ! -e /proc/sys/fs/binfmt_misc/qemu-x86_64 ]; then
            echo ':qemu-x86_64:M::\x7f\x45\x4c\x46\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x3e\x00:\xff\xff\xff\xff\xff\xfe\xfe\xfc\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-x86_64:OPF' > /proc/sys/fs/binfmt_misc/register
          fi
      user: "0"
      description: Mount binfmt_misc and register the qemu-x86_64 interpreter (both are volatile kernel state — must be redone on every boot)
