schemaVersion: "2"
kind: mixin
name: mise-runtimes
displayName: mise Language Runtime Domains
description: Extends the mise kit (docker/sbx-kits-contrib) with the domains mise's core plugins need to install Java, Go, Python, and Node

caps:
  network:
    allow:
      # Node
      - nodejs.org
      - unofficial-builds.nodejs.org
      - mise-versions.jdx.dev
      # Go
      - dl.google.com
      # Java (default "openjdk" vendor)
      - mise-java.jdx.dev
      - download.java.net
      # Shared: go version listing (git ls-remote), python-build-standalone
      # releases + assets, most non-default java vendors
      - github.com
      - api.github.com
      - objects.githubusercontent.com
