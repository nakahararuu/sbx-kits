name: Build and publish kits

# Builds every kit with the kit frontend and, on main, publishes each one as an
# OCI image:
#
#   ghcr.io/nakahararuu/sbx-kits/<kit>:<version>      the descriptor's version
#   ghcr.io/nakahararuu/sbx-kits/<kit>:latest         rolling
#   ghcr.io/nakahararuu/sbx-kits/<kit>:sha-<12 hex>   immutable, per commit
#
# Why publish at all: a `git+https://...` kit reference makes `sbx` build the
# kit on the host, and building a v3 kit needs a BuildKit that can export OCI
# images. Docker Desktop's default docker driver can't ("OCI exporter is not
# supported for the docker driver"), so `sbx env create` fails on a stock Mac.
# Hosts pull the published image instead, as with docker/sbx-kits-contrib
# (docker.io/sbx/<kit>).
#
# Pull requests run the same build with
# `--output type=cacheonly`: the frontend validates the descriptor during the
# build, so a kit that would fail to publish fails here first.
#
# The build itself lives in scripts/publish-kit.sh so it can be run locally:
#   DRY_RUN=1 scripts/publish-kit.sh <kit>

on:
  push:
    branches:
      - main
    paths:
      - "*/**"
      - "scripts/**"
      - ".github/workflows/build-and-publish-kits.yml"
  pull_request:
    paths:
      - "*/**"
      - "scripts/**"
      - ".github/workflows/build-and-publish-kits.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Superseded PR runs are just validation; a half-cancelled publish is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Retarget with repository variables instead of editing the workflow. Only
  # ghcr.io is wired for login below (GITHUB_TOKEN, no secrets to manage).
  IMAGE_PREFIX: ${{ vars.KIT_IMAGE_PREFIX || format('ghcr.io/{0}/sbx-kits', github.repository_owner) }}
  PLATFORMS: ${{ vars.KIT_PLATFORMS || 'linux/amd64,linux/arm64' }}
  # Publish only from main of this repository; everything else is a dry run.
  DRY_RUN: ${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || github.repository != 'nakahararuu/sbx-kits') && '1' || '' }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kits: ${{ steps.list.outputs.kits }}
    steps:
      - uses: actions/checkout@v4

      - name: List kit directories
        id: list
        run: |
          set -euo pipefail
          kits=$(scripts/discover-kits.sh | jq -R . | jq -sc .)
          echo "kits=$kits" >> "$GITHUB_OUTPUT"
          echo "Discovered kits: $kits"

  kit:
    needs: discover
    if: needs.discover.outputs.kits != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # One kit failing to build must not stop the others from publishing.
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.discover.outputs.kits) }}
    name: ${{ matrix.kit }}
    steps:
      - uses: actions/checkout@v4

      # Only needed once a kit ships a .dockerfile with RUN steps, which then
      # execute for the non-native platform under emulation.
      - uses: docker/setup-qemu-action@v3

      # The docker-container driver: it can export OCI images and push
      # multi-platform indexes, which the runner's default docker driver can't.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.DRY_RUN == '' && startsWith(env.IMAGE_PREFIX, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ${{ env.DRY_RUN == '' && 'Build and publish' || 'Build (dry run)' }} ${{ matrix.kit }}
        run: scripts/publish-kit.sh "${{ matrix.kit }}"
        env:
          GIT_SHA: ${{ github.sha }}
