schemaVersion: "2"
kind: mixin
name: langfuse-claude
displayName: Langfuse for Claude Code
description: Adds the Langfuse skill plugin from the official Anthropic marketplace and installs langfuse-cli

caps:
  network:
    allow:
      # marketplace / plugin source install (GitHub)
      - github.com
      - api.github.com
      # langfuse-cli install
      - registry.npmjs.org
      # Langfuse Cloud API / docs (EU cloud + docs site share the apex + single-label subdomains)
      - langfuse.com
      - "*.langfuse.com"
      # Langfuse Cloud API (US region; two-label subdomain, needs an explicit entry)
      - us.cloud.langfuse.com

credentials:
  # Langfuse auth is HTTP Basic (publicKey:secretKey), so both values are
  # independently dynamic per user/project — the credentials.apiKey.inject
  # scheme:basic sugar can't express that (it takes one dynamic secret plus
  # a *static* username), so neither entry is proxy-managed/masked here.
  # Declaring them still gets the approval-flow prompt (bind a host env var
  # if unset) instead of requiring a manual `sbx secret set-custom` dance.
  - service: langfuse-public-key
    description: "Langfuse public key (not sensitive — safe to expose, e.g. Langfuse's own client-side SDK usage)"
    required: true
    apiKey:
      name: LANGFUSE_PUBLIC_KEY
      inject:
        - domain: cloud.langfuse.com    # default Langfuse Cloud host (EU region) — used when LANGFUSE_HOST is unset
        - domain: us.cloud.langfuse.com # Langfuse Cloud US region — used when LANGFUSE_HOST is set to it
  - service: langfuse-secret-key
    description: "Langfuse secret key"
    required: true
    apiKey:
      name: LANGFUSE_SECRET_KEY
      inject:
        - domain: cloud.langfuse.com    # default Langfuse Cloud host (EU region) — used when LANGFUSE_HOST is unset
        - domain: us.cloud.langfuse.com # Langfuse Cloud US region — used when LANGFUSE_HOST is set to it

commands:
  install:
    - command: |
        claude plugin marketplace add anthropics/claude-plugins-official
        claude plugin install langfuse@claude-plugins-official
      user: "1000"
      description: Install the Langfuse skill plugin from the official Anthropic marketplace
    - command: |
        npm install -g langfuse-cli
      user: "0"
      description: Install langfuse-cli (companion CLI the skill uses for API access)
