schemaVersion: "2"
kind: mixin
name: langfuse-claude
displayName: Langfuse for Claude Code
description: Adds the Langfuse skill plugin from the official Anthropic marketplace and installs langfuse-cli

caps:
  network:
    allow:
      # marketplace / plugin source install (GitHub)
      - github.com
      - api.github.com
      # langfuse-cli install
      - registry.npmjs.org
      # Langfuse Cloud API / docs (EU cloud + docs site share the apex + single-label subdomains)
      - langfuse.com
      - "*.langfuse.com"
      # Langfuse Cloud API (US and JP regions; two-label subdomains, need explicit entries)
      - us.cloud.langfuse.com
      - jp.cloud.langfuse.com

credentials:
  # Langfuse auth is HTTP Basic. Rather than handing the CLI raw
  # publicKey/secretKey env vars, get the single combined Basic-auth value
  # (base64 of "publicKey:secretKey") from the host and let the proxy set
  # the Authorization header directly — the real secret never enters the
  # sandbox. See https://github.com/docker/sbx-releases/issues/292 (no
  # built-in base64 filter yet, so the bound value must be pre-encoded).
  - service: langfuse
    description: 'Langfuse HTTP Basic Auth credential: base64("publicKey:secretKey")'
    required: true
    apiKey:
      name: LANGFUSE_BASIC_AUTH
      proxyManaged: true
      inject:
        - domain: cloud.langfuse.com
          header: Authorization
          format: "Basic %s"
        - domain: us.cloud.langfuse.com
          header: Authorization
          format: "Basic %s"
        - domain: jp.cloud.langfuse.com
          header: Authorization
          format: "Basic %s"

environment:
  variables:
    # langfuse-cli builds its own (throwaway) Basic Auth header from these at
    # startup — they just need to be non-empty so the CLI doesn't refuse to
    # run. The proxy overwrites the real Authorization header for
    # cloud.langfuse.com / us.cloud.langfuse.com / jp.cloud.langfuse.com using
    # the `langfuse` credential above, so these values never reach Langfuse.
    LANGFUSE_PUBLIC_KEY: "pk-lf-proxy-managed"
    LANGFUSE_SECRET_KEY: "sk-lf-proxy-managed"

commands:
  install:
    - command: |
        claude plugin marketplace add anthropics/claude-plugins-official
        claude plugin install langfuse@claude-plugins-official
      user: "1000"
      description: Install the Langfuse skill plugin from the official Anthropic marketplace
    - command: |
        npm install -g langfuse-cli
      user: "0"
      description: Install langfuse-cli (companion CLI the skill uses for API access)
